name: SECURA Android APK (test)
on:
  workflow_dispatch:
  push:
    paths:
      - 'secura/android/**'
      - '.github/workflows/secura-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform project
        working-directory: secura/android
        run: flutter create --platforms=android --project-name=secura .
      - name: Remove generated template widget test
        working-directory: secura/android
        run: rm -f test/widget_test.dart
      - name: Resolve packages
        working-directory: secura/android
        run: flutter pub get
      - name: Static analysis
        working-directory: secura/android
        run: flutter analyze --no-fatal-infos
      - name: Build test APK
        working-directory: secura/android
        run: flutter build apk --debug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SECURA-Android-debug-APK
          path: secura/android/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
